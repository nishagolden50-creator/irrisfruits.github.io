<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Fruits Deli - Professional Management System</title>
    <style>
        :root {
            --bg-color: #f4f6f0;
            --primary-green: #1e4620;
            --accent-green: #388e3c;
            --text-dark: #212121;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --danger-red: #d32f2f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Security Shield Entry Cover */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .login-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); text-align: center; }
        .login-card h2 { color: var(--primary-green); margin-bottom: 8px; font-size: 24px; font-weight: 700; }
        .login-card p { font-size: 14px; color: #666; margin-bottom: 24px; }
        .pin-input { width: 100%; padding: 16px; font-size: 24px; text-align: center; letter-spacing: 12px; border: 2px solid var(--border-color); border-radius: 12px; margin-bottom: 20px; font-weight: 700; outline: none; transition: border 0.2s; }
        .pin-input:focus { border-color: var(--primary-green); }
        .btn-login { width: 100%; padding: 16px; font-size: 16px; background-color: var(--primary-green); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }

        /* Workspace Framework Grid */
        #main-app { display: none; width: 100%; max-width: 650px; flex-direction: column; gap: 16px; }
        header { width: 100%; margin-bottom: 8px; text-align: center; }
        header h1 { color: var(--primary-green); font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        .status-badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 700; background-color: #e8f5e9; color: #2e7d32; margin-top: 4px; }
        
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .metric-title { font-size: 12px; text-transform: uppercase; color: #666; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .metric-value { font-size: 22px; font-weight: 700; color: var(--text-dark); }
        
        .section-title { font-size: 16px; font-weight: 700; color: var(--primary-green); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .inventory-list { display: flex; flex-direction: column; gap: 10px; }
        .inventory-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; }
        .item-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .item-info p { font-size: 13px; color: #666; }
        .item-actions { display: flex; align-items: center; gap: 12px; }
        .qty-badge { font-weight: 700; font-size: 16px; min-width: 50px; text-align: center; }
        
        button { border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-sell { background-color: var(--accent-green); color: white; }
        .btn-edit { background-color: #f5f5f5; color: #424242; padding: 6px 12px; font-size: 12px; }

        /* Advanced Business Logs Display Layout */
        .logs-container { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; padding-right: 4px; }
        .log-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #fafafa; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; }
        .btn-void { background-color: transparent; color: var(--danger-red); font-size: 12px; padding: 2px 6px; }

        .pipeline-section { display: flex; gap: 10px; }
        .pipeline-section button { flex: 1; font-size: 13px; padding: 14px; color: white; }
        .btn-expense { background-color: #795548; }
        .btn-spoilage { background-color: #607d8b; }
    </style>
</head>
<body>

    <!-- Security Entry Shield Cover Panel Overlay -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>Iris Fruits Deli</h2>
            <p>Enter Professional Access PIN</p>
            <input type="password" id="pin-field" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
            <button type="button" id="login-button" class="btn-login">Unlock System Portal</button>
        </div>
    </div>

    <!-- Active Management Workspace Core -->
    <div id="main-app">
        <header>
            <h1>Iris Fruits Deli</h1>
            <p style="font-size: 13px; color: #666;">Corporate Management Suite <span class="status-badge">● Device Secure Storage</span></p>
        </header>

        <div class="metrics-grid">
            <div class="card">
                <div class="metric-title">Today's Total Sales</div>
                <div id="metric-sales" class="metric-value">KES 0</div>
            </div>
            <div class="card">
                <div class="metric-title">Net Operating Profit</div>
                <div id="metric-profit" class="metric-value">KES 0</div>
            </div>
            <div class="card" style="grid-column: span 2;">
                <div class="metric-title">Total Active Stock Value</div>
                <div id="metric-stock-val" class="metric-value">KES 0</div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Live Inventory Ledger</div>
            <div id="inventory-list-container" class="inventory-list"></div>
        </div>

        <div class="card">
            <div class="section-title">Real-Time Transactions Ledger Log</div>
            <div id="logs-container" class="logs-container">
                <p style="font-size: 13px; color: #777; text-align: center; padding: 12px;">No transactions logged today.</p>
            </div>
        </div>

        <div class="pipeline-section">
            <button class="btn-expense" id="expense-btn">➕ Log KES 500 Operational Transport</button>
            <button class="btn-spoilage" id="spoilage-btn">⚠️ Log KES 100 Stock Spoilage</button>
        </div>
    </div>

    <script>
        // Professional Memory Schema (Loads saved settings automatically on launch)
        let localInventory = JSON.parse(localStorage.getItem('irris_inventory')) || [
            { name: 'Bananas', quantity: 0, unit: 'bunches', cost_price: 0, selling_price: 0 },
            { name: 'Mangoes', quantity: 0, unit: 'pieces', cost_price: 0, selling_price: 0 },
            { name: 'Avocados', quantity: 0, unit: 'pieces', cost_price: 0, selling_price: 0 }
        ];
        let salesLog = JSON.parse(localStorage.getItem('irris_sales_log')) || [];
        let totalExpenses = Number(localStorage.getItem('irris_expenses')) || 0;

        function saveToStorage() {
            localStorage.setItem('irris_inventory', JSON.stringify(localInventory));
            localStorage.setItem('irris_sales_log', JSON.stringify(salesLog));
            localStorage.setItem('irris_expenses', totalExpenses.toString());
        }

        function verifyAccessPIN() {
            const pinField = document.getElementById('pin-field');
            if (pinField.value === "3456") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                renderApp();
            } else {
                alert("Incorrect PIN. Entry Denied.");
                pinField.value = '';
                pinField.focus();
            }
        }

        function renderApp() {
            const invContainer = document.getElementById('inventory-list-container');
            invContainer.innerHTML = '';
            let currentStockValue = 0;
            let totalSalesAmount = 0;

            localInventory.forEach((item, index) => {
                currentStockValue += (Number(item.quantity) * Number(item.cost_price));
                const row = document.createElement('div');
                row.className = 'inventory-item';
                row.innerHTML = `
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>Cost: KES ${item.cost_price} | Retail: KES ${item.selling_price}</p>
                    </div>
                    <div class="item-actions">
                        <button class="btn-edit" onclick="editItemPrompt(${index})">Edit Data</button>
                        <span class="qty-badge">${item.quantity} <span style="font-size:10px;color:#666;">${item.unit}</span></span>
                        <button class="btn-sell" onclick="processSale(${index})">Sell 1</button>
                    </div>
                `;
                invContainer.appendChild(row);
            });

            const logContainer = document.getElementById('logs-container');
            logContainer.innerHTML = '';
